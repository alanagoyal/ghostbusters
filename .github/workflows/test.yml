name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: uv run --no-sync python -m unittest discover -s backend/tests/unit -v
      - run: uv run --no-sync ruff check backend/src/local backend/src/camera.py backend/src/gallery_media.py backend/scripts/check_camera.py backend/scripts/cli.py backend/scripts/gallery.py backend/scripts/service_runner.py backend/scripts/projects.py backend/src/clients/vision.py backend/src/clients/supabase_client.py backend/tests/integration/private_gallery_sql.py scripts/setup_macos_service.py backend/tests/unit backend/tests/local_e2e.py
      - name: Frontend types, tests, and static production build
        run: bash scripts/check_frontend.sh

  private-gallery-policies:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ghostbusters_privacy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 backend/tests/integration/private_gallery_sql.py -v
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: test-only
          PGDATABASE: ghostbusters_privacy_test
  secret-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and run pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --log-opts=--all .
