[project]
name = "ghostbusters"
version = "0.1.0"
description = "Local-first doorstep costume gallery"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSES/MIT-original.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "opencv-python>=4.12.0.88",
    "python-dotenv>=1.1.1",
    "requests>=2.31.0",
    "psutil>=7.1.2,<8",
    "supabase>=2.12.0",
    "ultralytics>=8.3.63",
]

[project.scripts]
ghostbusters = "backend.scripts.cli:main"

[project.optional-dependencies]
local = [
    "mlx-vlm==0.7.10; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "zeroconf==0.151.5",
    "onvif-zeep==0.2.12",
    "pyobjc-framework-AVFoundation>=11; sys_platform == 'darwin'",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "ruff>=0.14.2",
]

[tool.ruff]
# Set the maximum line length to 88 (Black-compatible)
line-length = 88
target-version = "py311"

# Enable common linting rules
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Allow autofix for all enabled rules
lint.fixable = ["ALL"]

# Exclude common directories
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
